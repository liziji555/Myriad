name: Desktop

# 桌面外壳单独一个 workspace（desktop/），不在日常 CI 里编：它要装一堆系统库，编一次也慢。
# 改到它或它用到的启动代码时编一遍；打 v 开头的标签或手动触发时出安装包。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "crates/sa-cli/**"
      - "crates/sa-server/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb
            artifact: superagent-desktop-linux
            path: desktop/target/release/bundle/deb/*.deb
          - os: windows-latest
            bundles: nsis
            artifact: superagent-desktop-windows
            path: desktop/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 系统库（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo fmt --check
        working-directory: desktop
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: desktop
      - run: cargo test --locked
        working-directory: desktop
      - name: 打包
        run: pnpm dlx @tauri-apps/cli@2.12.4 build --bundles ${{ matrix.bundles }} -- --locked
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
      - name: 装一遍安装包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem desktop/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'Myriad'
          $run = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "安装包退出码 $($run.ExitCode)" }
          Get-ChildItem $dir | Select-Object Name, Length
          if (-not (Test-Path (Join-Path $dir 'superagent-desktop.exe'))) { throw '装完没有主程序' }
