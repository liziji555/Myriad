name: Release

# 打 v 开头的标签（如 v0.1.1）或在 Actions 里手动触发时，自动编译服务端和桌面端并发布到 GitHub Releases。
# 软件内的「检查更新 / 一键同步更新」会直接从最新 Release 拉取对应平台的文件并校验 SHA256SUMS.txt。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布版本号（如 v0.1.1；留空则使用当前日期）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bin: target/release/sa
            asset: sa-linux-x86_64
          - os: windows-latest
            bin: target/release/sa.exe
            asset: sa-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p sa-cli
      - name: 重命名产物
        shell: bash
        run: |
          mkdir -p release-assets
          cp "${{ matrix.bin }}" "release-assets/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb
            glob: "desktop/target/release/bundle/deb/*.deb"
            asset: Myriad-linux-amd64.deb
          - os: windows-latest
            bundles: nsis
            glob: "desktop/target/release/bundle/nsis/*.exe"
            asset: Myriad-setup-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 系统库（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: 打包桌面版
        run: pnpm dlx @tauri-apps/cli@2.12.4 build --bundles ${{ matrix.bundles }} -- --locked
        working-directory: desktop
      - name: 重命名产物
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          files=(${{ matrix.glob }})
          test ${#files[@]} -ge 1
          cp "${files[0]}" "release-assets/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-assets/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成 SHA256SUMS.txt 并发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          sha256sum sa-linux-x86_64 sa-windows-x86_64.exe Myriad-setup-windows-x64.exe Myriad-linux-amd64.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.tag }}" ]; then
              TAG="${{ inputs.tag }}"
            else
              TAG="v0.1.0-$(date -u +%Y%m%d%H%M)"
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber sa-linux-x86_64 sa-windows-x86_64.exe Myriad-setup-windows-x64.exe Myriad-linux-amd64.deb SHA256SUMS.txt
          else
            gh release create "$TAG" --title "Myriad $TAG" --generate-notes sa-linux-x86_64 sa-windows-x86_64.exe Myriad-setup-windows-x64.exe Myriad-linux-amd64.deb SHA256SUMS.txt
          fi
