[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/liziji555/superagent"

[workspace.dependencies]
sa-protocol = { path = "crates/sa-protocol" }
sa-store = { path = "crates/sa-store" }
sa-engine = { path = "crates/sa-engine" }
sa-server = { path = "crates/sa-server" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
futures-util = "0.3"
mime_guess = "2"
rusqlite = { version = "0.43", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
ts-rs = "12"
uuid = { version = "1", features = ["v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
