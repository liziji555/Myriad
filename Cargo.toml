[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/liziji555/myriad"

[workspace.dependencies]
sa-protocol = { path = "crates/sa-protocol" }
sa-store = { path = "crates/sa-store" }
sa-engine = { path = "crates/sa-engine" }
sa-server = { path = "crates/sa-server" }
sa-llm = { path = "crates/sa-llm" }
sa-tools = { path = "crates/sa-tools" }
sa-kernel = { path = "crates/sa-kernel" }
sa-orchestrator = { path = "crates/sa-orchestrator" }
sa-adapters = { path = "crates/sa-adapters" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
eventsource-stream = "0.2"
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
hmac = "0.12"
html5ever = "0.40"
markup5ever_rcdom = "0.40"
html2text = "0.17"
ignore = "0.4"
mime_guess = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
tokio-util = "0.7"
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "job-object", "process-group"] }
toml = "1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
ts-rs = "12"
uuid = { version = "1", features = ["v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
