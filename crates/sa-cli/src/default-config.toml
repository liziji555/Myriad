# SuperAgent 配置文件。改完后重启 `sa serve` 生效；用 `sa doctor` 检查写得对不对。

[server]
# 只监听本机。要从其他设备访问，请放到反向代理后面，不要直接改成 0.0.0.0。
host = "127.0.0.1"
port = 4517

# 模型服务。密钥不写在这里，只写「存放密钥的环境变量名」。
[providers.deepseek]
kind = "openai_compat"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
# 其他 OpenAI 兼容的服务也可以照这个格式加一段。有的网关要求每个会话带一个固定的请求头，
# 用 session_header 指定名字，例如 OpenCode Go：
#   [providers.opencode-go]
#   kind = "openai_compat"
#   base_url = "https://opencode.ai/inference/go/v1"
#   api_key_env = "OPENCODE_API_KEY"
#   session_header = "x-opencode-session"
# 然后把 [tiers] 里的 provider 和 model 改成它（例如 model = "deepseek-v4.1-flash"）。

# 模型档位。Bot 只引用档位（cheap / mid / strong），换模型只改这里。
# thinking 控制思考模式：true 开、false 关，不写就用模型服务的默认值。
[tiers]
cheap = { provider = "deepseek", model = "deepseek-flash", thinking = false }
mid = { provider = "deepseek", model = "deepseek-flash" }
strong = { provider = "deepseek", model = "deepseek-v4-pro" }

[budget]
# 每天的花费上限。注意：这个版本还不会按它拦截模型调用，花费请在模型服务的控制台里看；
# 预算守卫做好之后，到了上限会停止调用模型。
daily_limit = 50.0
currency = "CNY"
