# Myriad 配置文件。改完后重启 `sa serve` 生效；用 `sa doctor` 检查写得对不对。

[server]
# 只监听本机。要从其他设备访问，请放到反向代理后面，不要直接改成 0.0.0.0。
host = "127.0.0.1"
port = 4517

# 模型服务。密钥不写在这里，只写「存放密钥的环境变量名」。
[providers.deepseek]
kind = "openai_compat"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
# 其他 OpenAI 兼容的服务也可以照这个格式加一段。有的网关要求每个会话带一个固定的请求头，
# 用 session_header 指定名字，例如 OpenCode Go：
#   [providers.opencode-go]
#   kind = "openai_compat"
#   base_url = "https://opencode.ai/inference/go/v1"
#   api_key_env = "OPENCODE_API_KEY"
#   session_header = "x-opencode-session"
# 然后把 [tiers] 里的 provider 和 model 改成它（例如 model = "deepseek-v4.1-flash"）。
# Claude 官方接口（或兼容 Anthropic 格式的中转）用 kind = "anthropic"：
#   [providers.claude]
#   kind = "anthropic"
#   base_url = "https://api.anthropic.com"
#   api_key_env = "ANTHROPIC_API_KEY"
# 这种服务不开思考模式（thinking 写了也不开）；上下文窗口按 200,000 算。

# 模型档位。Bot 只引用档位（cheap / mid / strong），换模型只改这里。
# thinking 控制思考模式：true 开、false 关，不写就用模型服务的默认值。
# context_window 是模型的上下文窗口（token）。对话快占满时会自动把前面的部分压缩成摘要；
# 不写就按 1,000,000 算。模型的窗口更小，或者想早点压缩省钱，就写上，例如 context_window = 128000。
[tiers]
cheap = { provider = "deepseek", model = "deepseek-flash", thinking = false }
mid = { provider = "deepseek", model = "deepseek-flash" }
strong = { provider = "deepseek", model = "deepseek-v4-pro" }

[budget]
# 所有房间加起来每天最多花多少。到了上限，模型调用暂停到第二天（本机时间零点）；花到 80% 时提醒一次。
# 0 表示不限。
daily_limit = 50.0
# 一个任务最多花多少。到了上限任务会停下等你：让它继续就是再给它一份额度。0 表示不限。
task_limit = 10.0
currency = "CNY"

[rooms]
# 一个房间里同时最多几个 Bot 在说话，多的排队。几个一起说时花费也成倍上升。
max_parallel_bots = 3

[prices]
# 算花费用的价格：每一百万 token 多少钱，单位同上。
# 下面的数不是哪家的真实价格，是故意偏高的占位：请按你用的模型服务的价目表改，
# 否则算出来的花费偏高，会比实际更早到上限。cached_input 是命中缓存的输入，不写就和 input 一样。
default = { input = 10.0, cached_input = 10.0, output = 30.0 }
# 给某个模型单独定价，名字和 [tiers] 里的 model 一样：
# "deepseek-flash" = { input = 1.0, cached_input = 0.1, output = 2.0 }

[github]
# 任务里的 Bot 开 PR 用（每次都要你批准）。令牌放在环境变量里，不写进这个文件；
# 需要对仓库有 Pull requests 的写权限。不设令牌时别的功能不受影响，只是开不了 PR。
api_base = "https://api.github.com"
token_env = "GITHUB_TOKEN"
# 仓库不写就从工作目录的 origin 地址里认；认不出来时写在这里：
# repo = "owner/name"
# 接收 GitHub 事件（issue、评论、CI 结果）：在仓库的 Webhook 设置里把地址填成
# 「你的公网地址/hooks/github」、内容类型选 application/json、密钥和下面这个环境变量里的一样。
# 不设密钥就不接收。哪个仓库进哪个房间，在界面的「连接」页或者用 sa link github 来定。
webhook_secret_env = "GITHUB_WEBHOOK_SECRET"
# 只收带这些标签之一的新 issue；空着就都收。
issue_labels = []

[telegram]
# 在 Telegram 里和房间里的 Bot 说话：找 @BotFather 建一个机器人，把它给的令牌放进这个环境变量。
# 不设令牌就不连 Telegram。哪个聊天进哪个房间，在界面的「连接」页里生成配对码来定。
token_env = "TELEGRAM_BOT_TOKEN"
api_base = "https://api.telegram.org"

# 外部 MCP 服务：它们的工具会加给每个 Bot，名字是 mcp__<服务名>__<工具名>。
# 每一节是一个服务。在本机启动、通过标准输入输出说话的，例如：
#
# [mcp.files]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "."]
# # 服务拿不到 sa 的环境变量（模型密钥之类），只有 PATH、HOME 这几个基本的。要给的写在这里：
# env = { LOG_LEVEL = "warn" }
# # 或者把 sa 自己环境里的变量原样传过去（密钥放环境变量里，不写进这个文件）：
# env_from = ["FILES_TOKEN"]
# # 它的工具每次调用都要你批准；这里列出的不用问：
# auto_approve = ["read_file", "list_directory"]
# # enabled = false   # 先停用
#
# 通过网址连的远程服务写 url，不写 command：
#
# [mcp.docs]
# url = "https://example.com/mcp"
# # 它要令牌的话，放在环境变量里，这里写变量名：请求会带上 Authorization: Bearer <令牌>
# token_env = "DOCS_TOKEN"
# # 别的请求头：
# headers = { X-Team = "a" }
# auto_approve = ["search"]
#
# 用 sa mcp test 试一下能不能连上、有哪些工具。
