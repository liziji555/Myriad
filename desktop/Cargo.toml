[package]
name = "sa-desktop"
description = "Myriad 的桌面外壳：一个窗口，里面是同一个本机服务和同一个界面"
version = "0.6.1"
edition = "2021"
license = "MIT"
publish = false

# 不放进仓库根的 workspace：它要系统的 WebView 开发库，放进去的话 `cargo test --workspace` 就得人人都装。
[workspace]

[[bin]]
name = "superagent-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
sa-cli = { path = "../crates/sa-cli" }
serde_json = "1"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
